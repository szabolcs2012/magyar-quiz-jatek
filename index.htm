<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kvíz Játék</title>

    <link rel="stylesheet" href="style.css">

    <!-- =========================
         EMAILJS
         ========================= -->

    <script
        type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

</head>

<body>

    <!-- =========================
         KEZDŐKÉPERNYŐ
         ========================= -->

    <div id="start-screen" class="screen">

        <h1>🧠 Kvíz Játék</h1>

        <p>Add meg a neved!</p>

        <input
            type="text"
            id="player-name"
            placeholder="Írd be a neved..."
            maxlength="20"
        >

        <button onclick="startGame()">
            🎮 KEZDÉS
        </button>

        <button onclick="showLeaderboard()">
            🏆 LEADERBOARD
        </button>

    </div>


    <!-- =========================
         KÉRDÉSSZÁM VÁLASZTÁS
         ========================= -->

    <div id="question-count-screen" class="screen hidden">

        <h1>Hány kérdést szeretnél?</h1>

        <p id="welcome-text"></p>

        <div class="question-buttons">

            <button onclick="selectQuestionCount(30)">
                30 kérdés
            </button>

            <button onclick="selectQuestionCount(60)">
                60 kérdés
            </button>

            <button onclick="selectQuestionCount(120)">
                120 kérdés
            </button>

        </div>

    </div>


    <!-- =========================
         KATEGÓRIA VÁLASZTÁS
         ========================= -->

    <div id="category-screen" class="screen hidden">

        <h1>📚 Válassz kategóriát!</h1>

        <p>
            Válaszd ki, milyen témákból szeretnél kérdéseket.
        </p>

        <div class="categories">

            <button onclick="toggleCategory(this, 'informatika')">
                💻 Informatika
            </button>

            <button onclick="toggleCategory(this, 'foldrajz')">
                🌍 Földrajz
            </button>

            <button onclick="toggleCategory(this, 'tortenelem')">
                📜 Történelem
            </button>

            <button onclick="toggleCategory(this, 'biologia')">
                🧬 Biológia
            </button>

        </div>

        <button onclick="startQuiz()">
            🚀 Kvíz indítása
        </button>

    </div>


    <!-- =========================
         NEHÉZSÉG VÁLASZTÁS
         ========================= -->

    <div id="difficulty-screen" class="screen hidden">

        <h1>🎯 Válassz nehézséget!</h1>

        <p>
            Milyen nehézségű kérdéseket szeretnél?
        </p>

        <div class="difficulty-buttons">

            <button onclick="selectDifficulty('konnyu')">
                🟢 Könnyű
            </button>

            <button onclick="selectDifficulty('kozepes')">
                🟡 Közepes
            </button>

            <button onclick="selectDifficulty('nehez')">
                🔴 Nehéz
            </button>

        </div>

    </div>
